<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 90" role="img" aria-label="CH.">

  <!-- ── C  (three rectangular strokes — tech/geometric style) ── -->
  <rect x="0"  y="0"  width="50" height="11" rx="1.5" fill="#FFFFFF"/>
  <rect x="0"  y="0"  width="11" height="55" rx="1.5" fill="#FFFFFF"/>
  <rect x="0"  y="44" width="50" height="11" rx="1.5" fill="#FFFFFF"/>

  <!-- ── H  (two verticals + crossbar) ── -->
  <rect x="62"  y="0"  width="11" height="55" rx="1.5" fill="#FFFFFF"/>
  <rect x="103" y="0"  width="11" height="55" rx="1.5" fill="#FFFFFF"/>
  <rect x="62"  y="21" width="52" height="10" rx="1"   fill="#FFFFFF"/>

  <!-- ── Orange square dot ── -->
  <rect x="116" y="43" width="11" height="11" fill="#E97132"/>

  <!-- ── Baseline ── -->
  <line x1="0" y1="64" x2="132" y2="64"
        stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── Damped waveform (amplitude decreases left → right) ── -->
  <path d="M 0,64
           C 5,64  9,52  14,52
           C 19,52 23,64 27,64
           C 31,64 36,73 41,73
           C 46,73 51,64 55,64
           C 59,64 63,58 68,58
           C 73,58 78,64 83,64
           C 88,64 92,67 97,67
           C 102,67 106,64 111,64
           C 115,64 117,63 120,63
           C 123,63 126,64 132,64"
        stroke="#FFFFFF" stroke-width="1.8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
